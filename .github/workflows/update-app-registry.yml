name: update-app-registry

on:
  repository_dispatch:
    types: [app-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Update app registry
        env:
          APP_NAME:     ${{ github.event.client_payload.name }}
          APP_VERSION:  ${{ github.event.client_payload.version }}
          APP_REPO:     ${{ github.event.client_payload.repo }}
          APP_REF:      ${{ github.event.client_payload.ref }}
          APP_CATEGORY: ${{ github.event.client_payload.category }}
          APP_DESC:     ${{ github.event.client_payload.description }}
          # downloads: a JSON object mapping platform -> download URL,
          # e.g. {"windows":"...","macos":"...","linux":"..."}. It is a
          # structured value, so it MUST be wrapped in toJSON(): injecting a raw
          # mapping into a scalar env value fails the workflow at template-compile
          # time ("A mapping was not expected"), before any step runs. toJSON()
          # serializes it to a JSON string the Python below parses; an omitted
          # field becomes the literal "null".
          APP_DOWNLOADS: ${{ toJSON(github.event.client_payload.downloads) }}
          # Optional, same gradual-rollout / preserve semantics as the plugin
          # registry's icon field (see AGENTS.md).
          APP_ICON:            ${{ github.event.client_payload.icon }}
          APP_DESCRIPTION_URL: ${{ github.event.client_payload.description_url }}
        run: |
          python3 - <<'EOF'
          import json, os

          name     = os.environ["APP_NAME"]
          version  = os.environ["APP_VERSION"]
          repo     = os.environ["APP_REPO"]
          # ref defaults to v{version} (the tag the app's release.yml created),
          # but the dispatcher may override it.
          ref      = os.environ.get("APP_REF") or f"v{version}"
          category = os.environ["APP_CATEGORY"]
          desc     = os.environ["APP_DESC"]
          # downloads is the app analogue of the plugin source object: a map of
          # platform -> url. Apps have no install "source"; the catalog offers
          # these links directly.
          # APP_DOWNLOADS arrives as JSON text (via toJSON above): an object, the
          # literal "null" when omitted, or — to stay tolerant of an older payload
          # contract — a JSON-encoded string. Parse once, unwrap a double-encoded
          # string, and keep it only if it's a mapping.
          raw_downloads = (os.environ.get("APP_DOWNLOADS") or "").strip()
          parsed_downloads = json.loads(raw_downloads) if raw_downloads else None
          if isinstance(parsed_downloads, str):
              parsed_downloads = json.loads(parsed_downloads)
          downloads = parsed_downloads if isinstance(parsed_downloads, dict) else {}
          # Optional, catalog-only. Same preserve-on-omit rule as plugins.
          icon            = (os.environ.get("APP_ICON") or "").strip()
          description_url = (os.environ.get("APP_DESCRIPTION_URL") or "").strip()

          def find(apps, name):
              for a in apps:
                  if a["name"] == name:
                      return a
              return None

          def upsert(apps, name, entry):
              for i, a in enumerate(apps):
                  if a["name"] == name:
                      apps[i] = entry
                      return
              apps.append(entry)

          app_path = "app-marketplace.json"
          with open(app_path) as f:
              app_data = json.load(f)
          apps = app_data.setdefault("apps", [])
          existing = find(apps, name)

          entry = {
              "name":        name,
              "description": desc,
              "category":    category,
              "version":     version,
          }
          # Optional fields follow the plugin icon rule: a non-empty payload
          # value wins, an omitted value preserves what is already in the
          # registry, and the key is left out entirely when there is nothing.
          if not description_url and existing:
              description_url = (existing.get("description_url") or "").strip()
          if description_url:
              entry["description_url"] = description_url
          if not icon and existing:
              icon = (existing.get("icon") or "").strip()
          if icon:
              entry["icon"] = icon
          if not downloads and existing:
              downloads = existing.get("downloads") or {}
          if downloads:
              entry["downloads"] = downloads

          upsert(apps, name, entry)
          with open(app_path, "w") as f:
              json.dump(app_data, f, indent=2)
              f.write("\n")
          EOF

      - name: Build PR body
        env:
          APP_NAME:    ${{ github.event.client_payload.name }}
          APP_VERSION: ${{ github.event.client_payload.version }}
          # Optional. Free-form markdown release notes from the app's release
          # pipeline (normally the body of
          # `gh api repos/{owner}/{repo}/releases/generate-notes`). Rendered into
          # the PR body only — it is never written to app-marketplace.json.
          #
          # Wrapped in toJSON() for the same reason as APP_DOWNLOADS above, and it
          # matters more here: each app repo implements the sender independently,
          # so one that emits a JSON array of lines instead of a string would fail
          # this workflow at template-compile time ("A sequence was not
          # expected") before any step runs — silently dropping every release.
          # toJSON() also guarantees one scalar value; Python reads it from the
          # environment, so backticks, $, quotes and stray EOF lines in the
          # markdown never reach the shell.
          APP_CHANGELOG: ${{ toJSON(github.event.client_payload.changelog) }}
        run: |
          python3 - <<'EOF'
          import json, os

          name    = os.environ["APP_NAME"]
          version = os.environ["APP_VERSION"]

          # APP_CHANGELOG arrives as JSON text (via toJSON above): normally a
          # JSON string, the literal "null" when the field was omitted, or a JSON
          # array of lines. Decode once and normalise to plain text. Unlike
          # APP_DOWNLOADS we deliberately do NOT decode a string result a second
          # time — real changelog markdown can itself look like a JSON literal,
          # and double-decoding would corrupt it or raise.
          raw = os.environ.get("APP_CHANGELOG") or ""
          try:
              parsed = json.loads(raw) if raw.strip() else None
          except ValueError:
              parsed = raw  # not JSON at all — treat the raw value as the text
          if isinstance(parsed, list):
              parsed = "\n".join(str(item) for item in parsed)
          changelog = parsed if isinstance(parsed, str) else ""
          changelog = changelog.replace("\r\n", "\n").replace("\r", "\n").strip()

          # head/tail must stay byte-identical to the inline --body string this
          # step replaces, so a payload without a changelog produces exactly the
          # PR body we have always produced.
          head = (
              f"Automated app-registry update triggered by `{name}` release pipeline.\n"
              f"\n"
              f"**App:** `{name}`\n"
              f"**Version:** `{version}`\n"
          )
          tail = "\nReview `app-marketplace.json` and merge to publish the entry to the registry."

          def render(cl):
              return head + (f"\n## Changelog\n\n{cl}\n" if cl else "") + tail

          # GitHub rejects a PR body over 65536 characters. Measure conservatively
          # — the API may store the body with CRLF line endings, which costs one
          # extra character per line — and trim only the changelog, on a line
          # boundary, leaving a visible notice.
          LIMIT  = 65536
          MARGIN = 512
          NOTICE = "\n\n_Changelog truncated — the full release notes exceed GitHub's PR body limit. See the app's release page._"

          def wire_len(s):
              return len(s) + s.count("\n")

          if changelog:
              budget = LIMIT - MARGIN - wire_len(render("")) - wire_len(NOTICE)
              if wire_len(changelog) > budget:
                  kept, used = [], 0
                  for line in changelog.split("\n"):
                      cost = len(line) + 2  # line + CRLF, worst case
                      if used + cost > budget:
                          break
                      kept.append(line)
                      used += cost
                  changelog = ("\n".join(kept).rstrip() + NOTICE) if kept else NOTICE.strip()

          body = render(changelog)

          path = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "pr-body.md")
          # No trailing newline (otherwise every future body would drift one byte
          # from the historical one), newline="\n" so a local Windows run produces
          # identical bytes to the runner.
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(body)
          print(f"PR body: {len(body)} chars, changelog: {'yes' if changelog else 'no'} -> {path}")
          EOF

      - name: Commit to feature branch and open PR
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          APP_NAME:    ${{ github.event.client_payload.name }}
          APP_VERSION: ${{ github.event.client_payload.version }}
        run: |
          BRANCH="app-update/${APP_NAME}-v${APP_VERSION}"
          # Written by the "Build PR body" step. Passed as a file because the
          # changelog is multi-line markdown that cannot live in an inline
          # --body argument and must never be shell-interpolated.
          BODY_FILE="${RUNNER_TEMP:-/tmp}/pr-body.md"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app-marketplace.json
          if git diff --cached --quiet; then
            echo "No changes, skipping PR"
            exit 0
          fi
          git commit -m "chore: update app ${APP_NAME} to v${APP_VERSION}"
          # Idempotent: force-push overwrites a stale branch from a previous
          # run for the same version (e.g. when the workflow was re-triggered).
          git push --force origin "$BRANCH"
          # PR may also already exist for that branch — only create if missing.
          if gh pr view "$BRANCH" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists — leaving it open."
          else
            gh pr create \
              --title "app: ${APP_NAME} v${APP_VERSION}" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BRANCH"
          fi
